server.port=8888
spring.application.name=config-server
spring.cloud.config.server.git.uri=file://${user.home}/Documents/GitHub/nwt/config-repo
spring.cloud.config.server.git.default-label=master
spring.cloud.config.server.git.force-pull=true
spring.cloud.config.server.git.clone-on-start=true

# Fallback to native when git is not available
spring.profiles.include=native
spring.cloud.config.server.native.search-locations=file://${user.home}/Documents/GitHub/nwt/config-repo
