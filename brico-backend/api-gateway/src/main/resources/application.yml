server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-route
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**

        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: salon-route
          uri: lb://salon-service
          predicates:
            - Path=/api/salons/**

        - id: booking-route
          uri: lb://booking-service
          predicates:
            - Path=/api/appointments/**

        - id: review-route
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**, /api/favorites/**, /api/clients/**

        - id: portfolio-route
          uri: lb://portfolio-service
          predicates:
            - Path=/api/subscriptions/**, /api/plans/**

        - id: events-route
          uri: lb://system-events-service
          predicates:
            - Path=/api/events/**

        - id: notification-route
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

jwt:
  secret: ${JWT_SECRET:brico-nwt-secret-key-must-be-at-least-32-chars!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    ba.unsa.etf.nwt: DEBUG
