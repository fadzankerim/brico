spring.application.name=salon-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brico_salons}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:brico}
spring.datasource.password=${DB_PASS:brico123}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.ba.unsa.etf.nwt=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ── Eureka Service Discovery ─────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.health-check-url-path=/actuator/health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── gRPC klijent (system-events-service) ─────────────────────────────
grpc.client.system-events-service.address=static://${GRPC_EVENTS_HOST:localhost}:${GRPC_EVENTS_PORT:9090}
grpc.client.system-events-service.negotiation-type=plaintext

# ── RabbitMQ ──────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:brico}
spring.rabbitmq.password=${RABBITMQ_PASS:brico123}
