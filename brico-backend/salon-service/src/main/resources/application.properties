spring.application.name=salon-service
server.port=8082

# ==============================
# H2 In-Memory baza (aktivno)
# ==============================
spring.datasource.url=jdbc:h2:mem:salondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# PostgreSQL (zakomentarisano - za produkciju)
# ==============================
# spring.datasource.url=jdbc:postgresql://localhost:5432/brico_salons
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.ba.unsa.etf.nwt=DEBUG
