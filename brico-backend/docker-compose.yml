version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brico
      POSTGRES_PASSWORD: brico123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brico"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
