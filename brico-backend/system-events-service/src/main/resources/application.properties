spring.application.name=system-events-service
server.port=8086

# ── PostgreSQL ────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brico_events}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:brico}
spring.datasource.password=${DB_PASS:brico123}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── gRPC server ───────────────────────────────────────────────────────
grpc.server.port=9090

# ── Swagger ──────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Eureka ───────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.health-check-url-path=/actuator/health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
