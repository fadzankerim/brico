spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
eureka.client.enabled=false
spring.cloud.config.enabled=false
spring.amqp.deserialization.trust.all=true

# Disable config server import during tests
spring.config.import=optional:configserver:

# RabbitMQ settings for tests
brico.rabbitmq.exchange=brico.appointments
brico.rabbitmq.queue.booked=notification.appointment.booked
brico.rabbitmq.queue.confirmed=appointment.confirmed
brico.rabbitmq.queue.rollback=appointment.rollback

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
