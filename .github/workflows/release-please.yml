name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push all services
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          services=(
            eureka-server
            config-server
            api-gateway
            user-service
            salon-service
            appointment-service
            notification-service
            system-events-service
          )
          for svc in "${services[@]}"; do
            docker build \
              -f "${svc}/Dockerfile" \
              -t "${{ secrets.DOCKER_USERNAME }}/brico-${svc}:${TAG}" \
              -t "${{ secrets.DOCKER_USERNAME }}/brico-${svc}:latest" \
              .
            docker push "${{ secrets.DOCKER_USERNAME }}/brico-${svc}:${TAG}"
            docker push "${{ secrets.DOCKER_USERNAME }}/brico-${svc}:latest"
          done
